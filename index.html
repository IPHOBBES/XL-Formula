<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Build ready-to-paste Excel formulas for XLOOKUP, FILTER, VSTACK and IF.">
  <meta name="theme-color" content="#0f0f12">
  <title>XL Formula Generator</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="title">XL Formula Generator</h1>
      <p class="tagline">Build reliable Excel formulas without wrestling with the syntax.</p>
    </header>

    <section class="card card-formula-type" aria-labelledby="formula-type-heading">
      <div class="formula-type-header">
        <h2 id="formula-type-heading" class="formula-type-title">Formula type</h2>
        <div class="formula-type-actions" role="group" aria-label="Reference style">
          <button type="button" id="mode-sheet" class="btn-mode" aria-pressed="true">Sheet</button>
          <button type="button" id="mode-table" class="btn-mode" aria-pressed="false">Table</button>
        </div>
      </div>
      <p class="hint formula-type-hint">Choose how your workbook is structured, then pick a formula.</p>
      <div id="formula-type" class="formula-buttons" role="group" aria-label="Formula type">
        <button type="button" class="btn-formula" data-formula="xlookup" aria-pressed="true">XLOOKUP</button>
        <button type="button" class="btn-formula" data-formula="iferror_xlookup" aria-pressed="false">IFERROR + XLOOKUP</button>
        <button type="button" class="btn-formula" data-formula="filter" aria-pressed="false">FILTER</button>
        <button type="button" class="btn-formula" data-formula="vstack_filter" aria-pressed="false">VSTACK + FILTER</button>
        <button type="button" class="btn-formula" data-formula="if" aria-pressed="false">IF</button>
      </div>
    </section>

    <div class="params-row params-row-hidden" id="params-row">
      <section class="card params-card" id="params-to-card">
        <h2 id="params-to-heading" class="params-card-title">To</h2>
        <p class="hint params-hint" id="params-to-hint"></p>
        <div id="params-to-container"></div>
      </section>
      <section class="card params-card" id="params-from-card">
        <h2 id="params-from-heading" class="params-card-title">From</h2>
        <p class="hint params-hint" id="params-from-hint"></p>
        <div id="params-from-container"></div>
      </section>
    </div>

    <section class="card card-output-hidden" id="output-card" aria-labelledby="output-heading">
      <h2 id="output-heading">Formula</h2>
      <div class="value-row">
        <output id="formula-output" class="formula-output mono" aria-live="polite">—</output>
        <button type="button" id="btn-copy" class="btn-copy" disabled title="Copy formula" aria-label="Copy formula to clipboard">Copy</button>
      </div>
      <p id="formula-status" class="formula-status" aria-live="polite">Complete the fields above to build your formula.</p>
    </section>

    <footer class="footer">&gt;<span class="cursor-blink" aria-hidden="true">_</span> inder</footer>
  </main>
  <script src="formula-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
